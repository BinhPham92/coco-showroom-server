spring:
  application:
    name: coco-showroom-server

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/cocoshowroom}
    username: ${SPRING_DATASOURCE_USERNAME:cocoshowroom}
    password: ${SPRING_DATASOURCE_PASSWORD:cocoshowroom}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate   # Flyway owns the schema; Hibernate only validates
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  # Java 21 virtual threads — simple blocking code with near-reactive throughput
  threads:
    virtual:
      enabled: true

  mail:
    host: ${MAIL_HOST:smtp.sendgrid.net}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:apikey}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: 8080
  shutdown: graceful
  forward-headers-strategy: native   # trust X-Forwarded-For from Nginx

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

app:
  cors:
    origins: ${APP_CORS_ORIGINS:http://localhost:3031}

  jwt:
    secret: ${JWT_SECRET:dev-secret-change-in-production-must-be-at-least-32-characters}
    expiration-hours: ${JWT_EXPIRATION_HOURS:2}   # keep short — no revocation list in v1

  storage:
    # Base URL prepended to image storage keys — no trailing slash.
    # Local dev: Next.js public folder. Production: CDN origin (S3/R2).
    base-url: ${STORAGE_BASE_URL:http://localhost:3031}

  admin:
    # Identity for the auto-seeded STAFF account (created on first boot).
    # The first time this OAuth account signs in it receives a STAFF JWT.
    email: ${ADMIN_EMAIL:admin@cocoshowroom.vn}
    provider: ${ADMIN_PROVIDER:google}

  oauth:
    google:
      client-id: ${GOOGLE_CLIENT_ID:}

  mail:
    from-address: ${MAIL_FROM_ADDRESS:no-reply@cocoshowroom.vn}
    from-name: ${MAIL_FROM_NAME:Coco Showroom}
