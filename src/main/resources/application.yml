spring:
  application:
    name: coco-showroom-server

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/cocoshowroom}
    username: ${SPRING_DATASOURCE_USERNAME:cocoshowroom}
    password: ${SPRING_DATASOURCE_PASSWORD:cocoshowroom}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate   # Flyway owns the schema; Hibernate only validates
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  # Java 21 virtual threads — simple blocking code with near-reactive throughput
  threads:
    virtual:
      enabled: true

server:
  port: 8080
  shutdown: graceful
  forward-headers-strategy: native   # trust X-Forwarded-For from Nginx

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

app:
  cors:
    origins: ${APP_CORS_ORIGINS:http://localhost:3031}

  jwt:
    secret: ${JWT_SECRET:dev-secret-change-in-production-must-be-at-least-32-characters}
    expiration-hours: ${JWT_EXPIRATION_HOURS:24}

  storage:
    # Base URL prepended to image storage keys — no trailing slash.
    # Local dev: Next.js public folder. Production: CDN origin (S3/R2).
    base-url: ${STORAGE_BASE_URL:http://localhost:3031}

  admin:
    # Credentials for the auto-seeded STAFF account (created on first boot).
    # Change both values before first production boot.
    email: ${ADMIN_EMAIL:admin@cocoshowroom.vn}
    password: ${ADMIN_PASSWORD:changeme}
