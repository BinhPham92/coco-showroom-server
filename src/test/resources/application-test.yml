spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop   # Hibernate creates schema from entities in tests
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: true

  flyway:
    enabled: false   # Flyway disabled in tests; Hibernate owns schema creation

  mail:
    # Keeps MailSenderAutoConfiguration active so OrderEmailService can be wired.
    # Actual SMTP connections are never made: the @Async listener catches
    # MessagingException and logs it; no test assertion depends on email delivery.
    host: localhost
    port: 25

app:
  cors:
    origins: http://localhost:3031
  jwt:
    secret: test-secret-at-least-32-characters-long
  storage:
    base-url: http://localhost:3031
  admin:
    email: admin@test.com
    provider: google
  oauth:
    google:
      client-id: test-google-client-id
  mail:
    from-address: no-reply@test.com
    from-name: Coco Showroom Test
