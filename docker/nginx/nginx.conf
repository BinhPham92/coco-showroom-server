events {
    worker_connections 1024;
}

http {
    upstream app {
        server app:8080;
    }

    # HTTP → HTTPS redirect + ACME challenge passthrough for Certbot
    server {
        listen 80;
        server_name _;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS — replace api.cocoshowroom.vn with your actual domain
    server {
        listen 443 ssl;
        server_name api.cocoshowroom.vn;

        ssl_certificate     /etc/letsencrypt/live/api.cocoshowroom.vn/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api.cocoshowroom.vn/privkey.pem;

        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        # API routes
        location /v1/ {
            proxy_pass         http://app;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   X-Request-Id      $request_id;
        }

        # Health check — not exposed publicly in prod, but useful for load balancers
        location /actuator/health {
            proxy_pass http://app;
        }
    }
}
